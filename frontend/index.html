<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b7a73" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15120e" />
    <meta name="description" content="Waste sites in India, reported by residents and verified." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>JunkSnap</title>
    <!-- Applies a saved Light or Dark choice before first paint (ThemePreference uses the same key). -->
    <script>
      try {
        var theme = localStorage.getItem('junksnap.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
