[package]
name = "junksnap"
version = "0.1.0"
description = "JunkSnap Android shell: bundles frontend/dist in a WebView"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "junksnap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-sharekit = "0.3.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
