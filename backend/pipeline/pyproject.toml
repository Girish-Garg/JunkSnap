[project]
name = "junksnap-pipeline"
version = "0.1.0"
description = "JunkSnap pipeline: moderation, authenticity, location, sites and scores."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43",
    "fastapi>=0.143",
    "httpx>=0.28",
    "imagehash>=4.3",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    "pillow>=12.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "shapely>=2.2",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb,geo-places,rekognition,s3,secretsmanager,sqs]>=1.43",
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90", "PL", "N", "UP", "SIM", "RET", "ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 25
max-branches = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
