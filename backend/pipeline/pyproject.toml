[project]
name = "junksnap-pipeline"
version = "0.1.0"
description = "JunkSnap pipeline: moderation, authenticity, location, sites and scores."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43",
    "fastapi>=0.143",
    "httpx>=0.28",
    "imagehash>=4.3",
    "numpy>=2.5",
    "opencv-python-headless>=5.0",
    "pillow>=12.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "shapely>=2.2",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "boto3-stubs[comprehend,dynamodb,geo-places,rekognition,s3,secretsmanager,sqs]>=1.43",
    "httpx>=0.28",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
