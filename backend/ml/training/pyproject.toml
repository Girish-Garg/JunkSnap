[project]
name = "junksnap-training"
version = "0.1.0"
description = "JunkSnap ML dataset tools: fetch public waste datasets, manifest, splits, labelling."
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.43",
    "pillow>=12.3",
]

[project.scripts]
training = "training.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[cloudformation,s3]>=1.43",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "training"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
