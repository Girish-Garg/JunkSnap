[project]
name = "junksnap-agent"
version = "0.1.0"
description = "JunkSnap agent: LLM layer, stacked verification, brands, rulebook and letters."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43",
    "fastapi>=0.143",
    "httpx>=0.28",
    "numpy>=2.5",
    "onnxruntime>=1.31",
    "pillow>=12.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.15",
    "scikit-learn>=1.9",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime,dynamodb,rekognition,s3,secretsmanager]>=1.43",
    "botocore[crt]>=1.43",
    "httpx>=0.28",
    "jsonschema>=4.25",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
