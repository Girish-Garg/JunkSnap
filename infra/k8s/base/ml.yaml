# ml: Python models behind POST /internal/verify; cluster-internal only (http://ml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
spec:
  # No replicas field: the HorizontalPodAutoscaler below owns the count.
  selector:
    matchLabels:
      app.kubernetes.io/name: ml
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml
    spec:
      serviceAccountName: ml
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ml
          image: junksnap-ml
          # Image CMD serves uvicorn on port 8000.
          ports:
            - name: http
              containerPort: 8000
          # ORIGINALS_BUCKET comes from the ConfigMap; trained models are read from its models/ prefix.
          envFrom:
            - configMapRef:
                name: junksnap-config
          env:
            - name: ML_MODEL_DIR
              value: /models
          volumeMounts:
            - name: models
              mountPath: /models
          # The app downloads and checks about 420 MB of models before it serves (SigLIP alone is 372 MB),
          # so liveness and readiness wait for this probe: up to 5 minutes.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          # About 1 GiB more than v0 for the SigLIP, YOLO and head sessions in ONNX Runtime.
          resources:
            requests: { cpu: 200m, memory: 1792Mi }
            limits: { cpu: "1", memory: 2560Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        # Model cache for this pod only; a new pod downloads and checks the files again.
        - name: models
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ml
spec:
  selector:
    app.kubernetes.io/name: ml
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
