# ml: Python models behind POST /internal/verify; cluster-internal only (http://ml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
spec:
  # No replicas field: the HorizontalPodAutoscaler below owns the count.
  selector:
    matchLabels:
      app.kubernetes.io/name: ml
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml
    spec:
      serviceAccountName: ml
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ml
          image: junksnap-ml
          # Image CMD serves uvicorn on port 8000.
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: junksnap-config
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { cpu: "1", memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: ml
spec:
  selector:
    app.kubernetes.io/name: ml
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
