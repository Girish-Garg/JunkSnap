# scores: TypeScript server image; recomputes area scores every 15 minutes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scores
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scores
        spec:
          serviceAccountName: scores
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scores
              image: junksnap-server
              command: [node, dist/handlers/scores.js]
              envFrom:
                - configMapRef:
                    name: junksnap-config
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
