# worker: TypeScript server image; long-polls SQS, not exposed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # 0 until the SQS poller lands (#11); today's loop polls nothing.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      serviceAccountName: worker
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: junksnap-server
          command: [node, dist/handlers/worker.js]
          envFrom:
            - configMapRef:
                name: junksnap-config
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
