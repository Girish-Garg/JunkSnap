# worker: TypeScript server image; long-polls SQS, not exposed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # One long-polling consumer. Keep it at 1: the site merge lock and the memory of new sites are in-process
  # (decision 20261011-1700-hem-merge-lock); more replicas need a shared lock first, or one spot can get two sites.
  replicas: 1
  # A deploy stops the old pod before the new one starts, so two in-process merge locks never run at once; SQS holds the gap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      serviceAccountName: worker
      nodeSelector:
        kubernetes.io/arch: amd64
      # SIGTERM stops receiving; in-flight messages finish or hit the poller's 240 s deadline first.
      terminationGracePeriodSeconds: 270
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: junksnap-server
          command: [node, dist/handlers/worker.js]
          envFrom:
            - configMapRef:
                name: junksnap-config
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
