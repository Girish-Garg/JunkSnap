apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: junksnap
resources:
  - serviceaccounts.yaml
  - api.yaml
  - worker.yaml
  - scores.yaml
  - ml.yaml
  - ingress.yaml
# Names from contracts/README.md; overlays merge in the per-stage values.
configMapGenerator:
  - name: junksnap-config
    literals:
      - AWS_REGION=ap-south-1
      - AWS_DEFAULT_REGION=ap-south-1
      - PRESIGN_TTL_SECONDS=300
      - ML_URL=http://ml
      # Brand judging runs in the worker, which has no provider keys: Bedrock only. Notes are pinned to Bedrock in code.
      - >-
        LLM_TASKS={"brands": {"provider": "bedrock", "model": "global.anthropic.claude-sonnet-4-6",
        "fallback": [{"provider": "bedrock", "model": "in.anthropic.claude-haiku-4-5-20251001-v1:0"},
        {"provider": "bedrock", "model": "apac.amazon.nova-pro-v1:0"}]}}
