# Human only, from a clean main: uv run scripts/deploy.py demo --human-approved --origins <amplify-url>,http://localhost:5173
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: junksnap-demo
labels:
  - pairs:
      junksnap/stage: demo
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: junksnap-config
    behavior: merge
    literals:
      - JUNKSNAP_STAGE=demo
      # deploy.py --origins overrides this; demo refuses to start with none.
      - CORS_ORIGINS=http://localhost:5173
