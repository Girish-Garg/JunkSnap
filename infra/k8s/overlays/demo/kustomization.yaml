# Human only, from a clean main. deploy.py --origins sets CORS_ORIGINS; the api refuses to start without it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: junksnap-demo
labels:
  - pairs:
      junksnap/stage: demo
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: junksnap-config
    behavior: merge
    literals:
      - JUNKSNAP_STAGE=demo
      # Public: the release key's certificate fingerprint for /.well-known/assetlinks.json (docs/android.md).
      - ANDROID_CERT_SHA256=B8:60:4A:F2:0A:0A:F9:1D:E4:A9:1B:BF:18:1E:27:01:FE:AB:E1:6C:44:01:87:EF:24:35:A5:FB:03:2D:A2:D8
