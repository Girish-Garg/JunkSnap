AWSTemplateFormatVersion: "2010-09-09"
Description: JunkSnap ECR repositories shared by every stage (stack junksnap-shared).

Resources:
  ServerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: junksnap-server
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "Keep the last 10 images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
            "action": {"type": "expire"}}]}

  MlRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: junksnap-ml
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "Keep the last 10 images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
            "action": {"type": "expire"}}]}

Outputs:
  ServerRepositoryUri:
    Description: TypeScript image for api, worker and scores
    Value: !GetAtt ServerRepository.RepositoryUri
  MlRepositoryUri:
    Description: Python image for ml
    Value: !GetAtt MlRepository.RepositoryUri
