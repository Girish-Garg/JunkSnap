# Shared lint rules for every Python file in the repo. Limits follow docs/working.md section 4.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "C90", "PL", "N", "UP", "SIM", "RET", "ARG"]

[lint.mccabe]
max-complexity = 8

[lint.pylint]
max-args = 4
max-statements = 25
max-branches = 8
