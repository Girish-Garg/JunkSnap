[project]
name = "ward-boundaries"
version = "0.1.0"
description = "Ward polygons built from official ward-formation texts and OpenStreetMap places."
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.40",
    "httpx>=0.28",
    "matplotlib>=3.10",
    "pyarrow>=26.0.0",
    "pypdf>=6.20.0",
    "shapely>=2.1",
]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime]>=1.40",
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["shapely", "shapely.*", "matplotlib", "matplotlib.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Lint rules come from the repo-wide ruff.toml (docs/working.md section 4).
[tool.ruff]
extend = "../../ruff.toml"
extend-exclude = [".cache"]
