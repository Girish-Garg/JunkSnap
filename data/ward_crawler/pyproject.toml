[project]
name = "ward-crawler"
version = "0.1.0"
description = "Builds sourced ward records from official public pages with an LLM extractor."
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.40",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pydantic>=2.11",
    "pypdf>=5.4",
]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime,dynamodb,s3]>=1.40",
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# Lint rules come from the repo-wide ruff.toml (docs/working.md section 4).
[tool.ruff]
extend = "../../ruff.toml"
extend-exclude = [".cache"]
